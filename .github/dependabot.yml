version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      ruby-dev-tooling:
        dependency-type: "development"
      aws-sdk:
        patterns:
          - "aws-sdk-*"
          - "aws-sigv4"
      ruby-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      css-toolchain:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "daisyui"
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/python_components/accessibility_scan"
      - "/python_components/ci"
      - "/python_components/classifier"
      - "/python_components/crawler"
      - "/python_components/document_inference"
      - "/python_components/evaluation"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      python-dev-tooling:
        patterns:
          - "pytest"
          - "pytest-*"
          - "black"
          - "flake8"
          - "isort"
          - "coverage"
      python-minor-patch:
        update-types: ["minor", "patch"]
